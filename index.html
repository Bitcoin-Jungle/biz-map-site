<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0e3b2a" />
    <meta
      name="description"
      content="Find businesses across Costa Rica that accept Bitcoin. The Bitcoin Jungle merchant map."
    />
    <link rel="apple-touch-icon" href="/logo192.png" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Warm up connections to the map lib + data APIs (TLS handshake in parallel). -->
    <link rel="preconnect" href="https://cdn.apple-mapkit.com" crossorigin />
    <link rel="preconnect" href="https://api.btcmap.org" crossorigin />
    <link rel="dns-prefetch" href="https://cdn.static.btcmap.org" />

    <!-- Type: self-hosted Bricolage Grotesque (display only, variable woff2, latin).
         Body uses the system stack. font-display:swap keeps text non-blocking. -->
    <link rel="preload" as="font" type="font/woff2" href="/fonts/bricolage.woff2" crossorigin />

    <title>Bitcoin Jungle Map · Costa Rica</title>
  </head>
  <body class="min-h-screen">
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
